<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a2e4d">
<title>Brightside</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --border: #e3e6ea; --text: #1a1d21;
    --muted: #6b7280; --accent: #1a2e4d; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb;
      --muted: #9aa3af; --accent: #60a5fa; --accent-text: #0f1115;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 40px 32px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    text-align: center;
  }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 12px; }
  p.tagline { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 28px; }
  a.cta {
    display: inline-block; background: var(--accent); color: var(--accent-text); text-decoration: none;
    font-size: 15px; font-weight: 600; padding: 12px 28px; border-radius: 8px;
  }
  a.cta:hover { opacity: 0.9; }
  p.contact { color: var(--muted); font-size: 13px; margin: 28px 0 0; }
  p.contact a { color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <h1>Brightside</h1>
  <p class="tagline">
    Brightside sources retail clearance and deal listings and screens each one against
    live Amazon marketplace data to identify resale opportunities worth pursuing.
  </p>
  <!-- TODO: replace with the scanner's real deployed URL -->
  <a class="cta" href="https://REPLACE-WITH-SCANNER-URL">Open Scanner</a>
  <!-- TODO: replace with a real contact address -->
  <p class="contact">Contact: <a href="mailto:REPLACE@EXAMPLE.COM">REPLACE@EXAMPLE.COM</a></p>
</div>
</body>
</html>
