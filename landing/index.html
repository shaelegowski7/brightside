<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a2e4d">
<title>Brightside</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --border: #e3e6ea; --text: #1a1d21;
    --muted: #6b7280; --accent: #1a2e4d; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb;
      --muted: #9aa3af; --accent: #60a5fa; --accent-text: #0f1115;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 40px 32px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    text-align: center;
  }
  .logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 12px; }
  .logo-badge {
    width: 36px; height: 36px; border-radius: 9px; background: #1a2e4d;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  h1 {
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.01em;
  }
  p.tagline { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 28px; }
  a.cta {
    display: inline-block; background: var(--accent); color: var(--accent-text); text-decoration: none;
    font-size: 15px; font-weight: 600; padding: 12px 28px; border-radius: 8px;
  }
  a.cta:hover { opacity: 0.9; }
  .contact { color: var(--muted); font-size: 13px; margin: 28px 0 0; }
  .contact p { margin: 4px 0; }
  .contact a { color: var(--muted); }
  .ebay-link { display: inline-flex; align-items: center; gap: 5px; vertical-align: middle; }
  .ebay-logo {
    height: 14px; width: auto; display: block;
    background: #ffffff; border-radius: 3px; padding: 3px 6px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-badge">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M3 21H21" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M6 21A6 6 0 0 1 18 21Z" fill="#EBA941"/>
        <path d="M12 8V5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M6.5 11L4.5 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M17.5 11L19.5 9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </span>
    <h1>Brightside</h1>
  </div>
  <p class="tagline">
    Brightside sources retail clearance and deal listings and screens each one against
    live Amazon marketplace data to identify resale opportunities worth pursuing.
  </p>
  <a class="cta" href="https://app.brightsidecommerce.co.uk">Open Scanner</a>
  <div class="contact">
    <p>Also selling on <a href="https://www.ebay.co.uk/usr/brightsidecommerce" target="_blank" rel="noopener" class="ebay-link"><img src="ebay-logo.png" alt="eBay" class="ebay-logo"> as Brightside Commerce</a>.</p>
    <p>Contact: <a href="mailto:sales@brightsidecommerce.co.uk">sales@brightsidecommerce.co.uk</a></p>
  </div>
</div>
</body>
</html>
