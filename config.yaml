# B&Q (diy.com) clearance scraper. No ScraperAPI needed -- confirmed live
# 2026-07-24 that diy.com serves full content to a plain request, no bot
# protection detected (see app/sources/bq.py's module docstring for the full
# recon writeup). The listing page's own JSON-LD ItemList carries title,
# price, url AND a real EAN/GTIN (`sku` field, 8 or 13 digits) directly, so
# unlike Argos/Smyths this needs no second per-product fetch at all --
# cheapest of every scraper source in this file. `?page=N` pagination
# confirmed working; clearance.cat alone had 851 items (~18 pages) at the
# time this was checked.
bq:
  enabled: true
  poll_interval_minutes: 180
  min_delay_seconds: 3
  max_delay_seconds: 8
  category_urls:
    - "https://www.diy.com/clearance.cat"
    - "https://www.diy.com/clearance/electrical-clearance.cat"
    - "https://www.diy.com/clearance/tools-equipment-clearance.cat"
    - "https://www.diy.com/clearance/home-furniture-clearance.cat"
    - "https://www.diy.com/clearance/outdoor-garden-clearance.cat"
    - "https://www.diy.com/clearance/kitchens-clearance.cat"

# Screwfix clearance scraper. No ScraperAPI needed -- confirmed live
# 2026-07-24, no bot protection detected. The clearance *landing* page is
# just a CMS hub with no product data; the real paginated listing is the
# search-results page for "clearancepromo" instead (see app/sources/
# screwfix.py's module docstring). No EAN anywhere on this site -- every
# match falls through to the title-search fallback. The adapter auto-appends
# page_size=100 to every fetch (found live 2026-07-25 via Playwright network
# capture of the site's own "100 per page" control -- 5x more items than the
# 20/page default, and the real ceiling: values above 100 silently fall back
# to 0 results). True pagination past 100 results is still unreachable via
# plain HTTP (the site's own per-page toggle calls an auth-token-gated JSON
# API this app can't authenticate against).
screwfix:
  enabled: true
  poll_interval_minutes: 180
  min_delay_seconds: 3
  max_delay_seconds: 8
  category_urls:
    - "https://www.screwfix.com/search?search=clearancepromo"
    - "https://www.screwfix.com/search?search=summersalepromo"

# Home Bargains clearance/offers scraper. No ScraperAPI needed -- confirmed
# live 2026-07-24, no bot protection detected. IMPORTANT: category_urls must
# point at the home.bargains short domain, NOT www.homebargains.co.uk --
# every path on the www host 301s to home.bargains's bare root regardless of
# the original path (see app/sources/homebargains.py's module docstring). No
# EAN anywhere on this site -- every match falls through to the title-search
# fallback. Pagination beyond page 1 is UNCONFIRMED (a `?page=2` param left
# the embedded currentPage at 1 in testing) -- capped at one page per
# category_url until the real mechanism is found.
homebargains:
  enabled: true
  poll_interval_minutes: 180
  min_delay_seconds: 3
  max_delay_seconds: 8
  category_urls:
    - "https://home.bargains/category/999/starbuys"

# John Lewis outlet/clearance scraper. No ScraperAPI needed -- confirmed
# live 2026-07-24, no bot protection detected. Uses the real "Outlet"
# section (Endeca-style faceted catalogue), NOT the "Special Offers" CMS
# hub, which has no inline product data at all (see app/sources/
# johnlewis.py's module docstring). Unlike B&Q, this DOES need a second
# per-product fetch -- GTIN only appears on product pages, not the listing
# -- but it's the standard `gtin13` JSON-LD key, so no retailer-specific
# extractor override was needed. Pagination beyond page 1 is UNCONFIRMED and
# appears to be genuinely broken via plain HTTP (the page's own `rel=next`
# link 404s when fetched directly) -- three sibling category_urls are
# configured instead of one to get a wider slice of the ~168-item outlet
# pool each poll, since true pagination isn't reachable this way.
johnlewis:
  enabled: true
  poll_interval_minutes: 180
  min_delay_seconds: 3
  max_delay_seconds: 8
  category_urls:
    - "https://www.johnlewis.com/browse/outlet/_/N-puqr"
    - "https://www.johnlewis.com/browse/outlet/home-outlet-offers/_/N-pu1z"
    - "https://www.johnlewis.com/browse/outlet/electrical-outlet-offers/_/N-pu2f"

# Pokemon Center UK restock/new-release monitor (Phase 3). Different signal
# than Argos: a "drop" is a stock-status transition, not a price change (see
# app/sources/pokemon_center.py). No EAN on this site at all, and no Keepa
# title-search fallback was built (project decision 2026-07-21) — every drop
# pings as "UNVERIFIED MATCH — check manually", with no ROI/price scoring.
# Cheap per poll (one listing-page request unless something actually drops),
# so a tighter interval than Argos is affordable — tune to taste.
pokemon_center:
  enabled: true
  poll_interval_minutes: 15
  min_delay_seconds: 3
  max_delay_seconds: 8
  # Additional categories, discovered the same way as Argos's above (Wayback
  # CDX index — no local ScraperAPI key to verify live). "back-in-stock" is a
  # direct match for this source's restock-monitor purpose; the others are
  # the classic high resale-value TCG product types (sealed boxes/packs are
  # the most commonly flipped Pokemon TCG items). Kept to a small addition —
  # this source has no EAN mechanism at all (_UNMATCHABLE_BY_DESIGN_SOURCES
  # in pipeline.py), so every hit here is an unscored "UNVERIFIED MATCH"
  # ping, not a profit-scored one; widening it trades noise for volume more
  # directly than HUKD/Argos do.
  category_urls:
    - "https://www.pokemoncenter.com/en-gb/category/new-releases"
    - "https://www.pokemoncenter.com/en-gb/category/back-in-stock"
    - "https://www.pokemoncenter.com/en-gb/category/elite-trainer-box"
    - "https://www.pokemoncenter.com/en-gb/category/booster-packs"

# Aggregate funnel + Keepa token-spend reporting. Uses existing deals.status
# and token_log data (see app/monitoring.py) -- no new logging call sites.
# Posts a daily Discord summary so the widened feeds/categories above are
# observable: is each source producing scored matches or just noise, and is
# total token spend staying inside budget. Also queryable on demand via
# GET /status/summary?hours=N.
monitoring:
  daily_summary_enabled: true
  summary_window_hours: 24
  # Weekly business digest (spec phase 3): hit rate + realised-vs-predicted
  # ROI from purchases/outcomes logging. Defaults on -- posts zeros before
  # anything's been logged yet, same precedent as shipping other sources
  # enabled before they had real data flowing.
  weekly_summary_enabled: true
  weekly_summary_window_hours: 168
  # Spec baseline: ~500-1300 tokens/day normally, 2000-4500 on store-run
  # days, ~28800/day base-tier ceiling. Set above the widened-volume
  # baseline but comfortably below the hard ceiling so an alert means
  # something real -- tune down once a few real days of data exist.
  daily_token_budget_alert: 6000
  # Flip the daily summary amber if any single source's fetch_blocked share
  # of its own deals exceeds this. resolver.py's docstring notes ~27%
  # blocked was the normal HUKD baseline in production (downstream
  # retailers blocking us, not HUKD itself) -- set above that background
  # rate so this means a source's bot-protection got meaningfully worse,
  # not the ordinary noise floor.
  blocked_rate_alert_pct: 0.5

# Category-based fee estimate fallback (SP-API not live yet). Ballpark figures
# based on Amazon UK's public referral-fee schedule and FBA size tiers — verify
# against Amazon's current published rates before trusting the numbers; every
# ping using this table is marked fees=estimated regardless.
fees:
  default_referral_pct: 0.15
  category_referral_pct:
    "Electronics": 0.08
    "Computers & Accessories": 0.08
    "PC": 0.08
    "Video Games": 0.15
    "Toys & Games": 0.15
    "Home & Kitchen": 0.15
    "Kitchen & Home": 0.15
    "Health & Personal Care": 0.15
    "Beauty": 0.15
    "Sports & Outdoors": 0.15
    "Tools & Home Improvement": 0.15
    "Grocery": 0.15
    "Pet Supplies": 0.15
  # FBA fulfilment fee by size tier, in pence. Placeholder ballparks — replace
  # with Amazon UK's current published FBA fee schedule.
  fba_fee_by_size_tier_pence:
    small_standard: 230
    standard: 320
    large_standard: 450
    oversize: 900
  # Monthly storage fee per unit, pence — used in est_months_to_sell calc.
  # Rough blended standard-size non-peak rate; oversize items cost more.
  monthly_storage_fee_pence:
    standard: 27
    oversize: 60
  # Simplified UK FBA size-tier breakpoints (max dimension in cm, max weight
  # in kg). First tier a product fits under (in this order) wins.
  size_tier_thresholds_cm_kg:
    small_standard: {max_weight_kg: 0.46, max_longest_cm: 35, max_dims_sum_cm: 60}
    standard:       {max_weight_kg: 9.0,  max_longest_cm: 45, max_dims_sum_cm: 90}
    large_standard: {max_weight_kg: 23.0, max_longest_cm: 61, max_dims_sum_cm: 210}
    # anything larger/heavier than large_standard is oversize
